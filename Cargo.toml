[package]
name = "pm"
version = "0.1.0"
edition = "2024"
# build.rs compiles bundled plugins and test fixtures from plugins/, a separate workspace
# that `cargo package` would leave out of the crate, so a published pm could not build.
# pm ships as the binaries release.yml attaches to each tag.
publish = false

[[bench]]
name = "argv"
harness = false

[[bench]]
name = "entrypoints"
harness = false

[[bin]]
name = "pm-lsp"
path = "src/bin/pm-lsp.rs"

[[bin]]
name = "pm-trace"
path = "src/bin/pm-trace.rs"

[[bin]]
name = "pm-vm-init"
path = "src/bin/pm-vm-init.rs"

[[bin]]
name = "pmd"
path = "src/bin/pmd.rs"

[workspace]
resolver = "3"
# pm's library and binaries stay in the root package, so `tests/`, `benches/` and
# build.rs keep working where they are and every binary keeps its name. What stands
# on its own below the build core lives under crates/. plugins/ and editors/zed are
# workspaces of their own: they compile to WebAssembly, not to the host.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
pm-cancel = { path = "crates/pm-cancel" }
pm-download = { path = "crates/pm-download" }
pm-elf = { path = "crates/pm-elf" }
pm-progress = { path = "crates/pm-progress" }
pm-signing = { path = "crates/pm-signing" }
pm-text = { path = "crates/pm-text" }
pm-vm = { path = "crates/pm-vm" }
pm-wire = { path = "crates/pm-wire" }
pm-workspace = { path = "crates/pm-workspace" }
arbitrary = { version = "1.4.2", features = ["derive"] }
clap = { version = "4.6.6", features = ["derive"] }
dialoguer = "0.12.0"
either = { version = "1.18.0", features = ["serde"] }
futures-lite = "2.6.1"
hakoniwa = { version = "1.8.0", features = ["landlock"] }
lsp-server = "0.10.0"
lsp-types = "0.97.0"
miette = "7.6.0"
minreq = { version = "3.0.0", features = ["https-rustls"] }
nix = { version = "0.31.3", features = ["fs", "mount", "process", "ptrace", "poll", "reboot", "signal", "term"] }
nom = "8.0.0"
rayon = "1.12.0"
# 1.27 calls a named function given to `Array::map` with (item, index) and no
# longer falls back to one argument, so `.map(helper)` in build files fails.
rhai = { version = "~1.26.1", features = ["grain", "internals", "metadata", "no_custom_syntax", "no_float", "no_time", "only_i64", "serde"] }
ring = "0.17.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
starlark = "0.14.2"
tempfile = "3.27.0"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = { version = "2.5.8", features = ["serde"] }
walkdir = "2.5.0"
wasmtime = { version = "49.0.0", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api", "p2p"] }


[dependencies]
pm-cancel.workspace = true
pm-download.workspace = true
pm-elf.workspace = true
pm-progress.workspace = true
pm-signing.workspace = true
pm-text.workspace = true
pm-vm.workspace = true
pm-wire.workspace = true
pm-workspace.workspace = true
arbitrary.workspace = true
clap.workspace = true
dialoguer.workspace = true
either.workspace = true
futures-lite.workspace = true
hakoniwa.workspace = true
lsp-server.workspace = true
lsp-types.workspace = true
# The fancy reports are for the binaries this package builds; the library crates
# take miette without them.
miette = { workspace = true, features = ["fancy"] }
minreq.workspace = true
nix.workspace = true
nom.workspace = true
rayon.workspace = true
rhai.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
starlark.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `env-filter` lets `RUST_LOG` choose what pm, pm-lsp and pm-trace log.
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url.workspace = true
walkdir.workspace = true
wasmtime.workspace = true
zbus.workspace = true

[build-dependencies]
# Encodes the bundled plugins built by build.rs as components.
wit-component = "0.262.0"

[dev-dependencies]
divan = "0.1.21"
proptest = "1.11.0"

# pm compiles its bundled WebAssembly plugins with Cranelift on first use. Unoptimised,
# that takes ~30s and every test that classifies a command pays it; optimised it is ~2s.
# Only the compiler is optimised, so pm's own code stays as debuggable as before.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.cranelift-entity]
opt-level = 3
[profile.dev.package.cranelift-bforest]
opt-level = 3
[profile.dev.package.cranelift-assembler-x64]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
[profile.dev.package.wasmtime-environ]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmtime]
opt-level = 3
[profile.dev.package.gimli]
opt-level = 3

# The release binaries are what ships, in release.yml's assets and in LosOS's
# image, so they trade build time for fat LTO and one codegen unit: inlining
# across crate boundaries (wasmtime, cranelift, zbus) and a smaller binary.
# plugins/ is its own workspace and sets the same in its own profile.
[profile.release]
lto = true
codegen-units = 1
