<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  pm's system service, pmd in its system mode. Only the pm user may own the name;
  anyone may call it, because every method asks polkit about its caller
  before it does anything.
-->
<busconfig>
  <policy user="pm">
    <allow own="org.pm1.System"/>
    <allow send_destination="org.pm1.System"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.pm1.System" send_interface="org.pm1.System"/>
    <allow send_destination="org.pm1.System" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.pm1.System" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
